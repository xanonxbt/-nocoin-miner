name: NoCoin Miner

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  mine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run miner
        env:
          ETH_ADDRESS: ${{ secrets.ETH_ADDRESS }}
          AGENT_NAME: ${{ secrets.AGENT_NAME }}
        run: timeout 300 python miner.py || true
